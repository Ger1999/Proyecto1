<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <form class="formulario-login" id="form-login">
      <h2>Plataforma Institucional</h2>
      <p class="subtitulo">Iniciar sesión</p>
      <label for="username">Correo institucional</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>

      <div class="entrar">
        <button type="submit">Entrar</button>
      </div>
      <p id="mensaje-error" class="error" style="color: red; margin-top: 10px;"></p>
    </form>
  </div>

  <script>
    // Usuarios
    const usuarios = [
      { usuario: 'Fernanda@certus.edu.pe', contra: 'admin1995' },
      { usuario: 'Cliente@certus.edu.pe', contra: 'cliente123' }
    ];

    document.getElementById('form-login').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const userVal = document.getElementById('username').value.trim();
      const passVal = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('mensaje-error');

      const encontrado = usuarios.find(u => u.usuario === userVal && u.contra === passVal);

      if (encontrado) {
        //sesión activa
        localStorage.setItem('usuarioLogueado', encontrado.usuario);
        window.location.href = 'index2.html'; // lleva a la página principal
      } else {
        errorDiv.textContent = 'Usuario o contraseña incorrectos.';
      }
    });
  </script>
</body>
</html>
